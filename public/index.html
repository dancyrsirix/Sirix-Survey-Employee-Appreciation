<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Appreciation Survey</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top"><div class="wrap"><h1>Employee Appreciation Survey</h1><span class="sub">Anonymous peer feedback</span></div></header>
<main class="wrap">
  <div class="card login">
    <h2>Enter your personal access code</h2>
    <p class="muted small">Your code was sent to you personally. It only serves to make sure each colleague is evaluated once per person. Your answers are never linked to your code.</p>
    <form id="form">
      <label for="code">Access code</label>
      <input id="code" type="text" class="code-input" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <div id="err" class="alert error" style="display:none"></div>
      <div class="actions"><button type="submit">Start</button></div>
    </form>
  </div>
</main>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const err = document.getElementById('err');
  err.style.display = 'none';
  const r = await fetch('/api/survey/' + encodeURIComponent(code));
  if (r.ok) { location.href = '/s/' + code; return; }
  const j = await r.json().catch(() => ({}));
  err.textContent = j.error || 'Invalid code.';
  err.style.display = 'block';
});
</script>
</body>
</html>

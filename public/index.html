<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sondage d’appréciation du travail</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div><div class="logo">Sirix</div><div class="tagline">Toujours présents. Constamment vigilants.</div></div>
  <div class="sub">Sondage interne<br>100 % anonyme</div>
</div></header>
<main class="wrap">
  <div class="card login">
    <h2>Entre ton code d’accès personnel</h2>
    <p class="muted small">Ton code t’a été envoyé personnellement. Il sert uniquement à s’assurer que chaque collègue est évalué une seule fois par personne. Tes réponses ne sont jamais associées à ton code.</p>
    <form id="form">
      <label for="code">Code d’accès</label>
      <input id="code" type="text" class="code-input" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <div id="err" class="alert error" style="display:none"></div>
      <div class="actions"><button type="submit">Commencer</button></div>
    </form>
  </div>
</main>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const err = document.getElementById('err');
  err.style.display = 'none';
  const r = await fetch('/api/survey/' + encodeURIComponent(code));
  if (r.ok) { location.href = '/s/' + code; return; }
  const j = await r.json().catch(() => ({}));
  err.textContent = j.error || 'Code invalide.';
  err.style.display = 'block';
});
</script>
</body>
</html>

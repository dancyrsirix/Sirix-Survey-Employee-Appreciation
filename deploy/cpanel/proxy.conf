# Apache include that makes https://sondage.sirixmonitoring.com serve the Node app
# listening on 127.0.0.1:3100. Install (as root) in BOTH locations:
#   /etc/apache2/conf.d/userdata/ssl/2_4/sirixmonitoring/sondage.sirixmonitoring.com/proxy.conf
#   /etc/apache2/conf.d/userdata/std/2_4/sirixmonitoring/sondage.sirixmonitoring.com/proxy.conf
# then:  /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
ProxyPreserveHost On
ProxyPass        /.well-known !
ProxyPass        / http://127.0.0.1:3100/
ProxyPassReverse / http://127.0.0.1:3100/
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
